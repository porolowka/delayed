<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELAYED | Магазин</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f0f1a; --bg2: #14142b; --card: #1a1a35;
            --card-hover: #20204a; --accent: #e94560; --gold: #ffd700;
            --text: #e8e8e8; --text-dim: #888; --border: rgba(255,255,255,0.08);
        }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .header {
            background: linear-gradient(135deg, #1a1a3e 0%, #0d0d1f 100%);
            padding: 30px 20px; text-align: center; border-bottom: 3px solid var(--accent);
        }
        .header h1 {
            font-size: 2.8em; font-weight: 900; letter-spacing: 6px;
            background: linear-gradient(135deg, #e94560, #ffd700);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header .sub { color: var(--text-dim); font-size: 0.9em; margin-top: 5px; letter-spacing: 2px; }
        .account-bar {
            background: var(--bg2); padding: 12px 20px;
            display: flex; align-items: center; justify-content: center;
            gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border);
        }
        .account-bar input {
            background: var(--card); border: 1px solid var(--border); color: var(--text);
            padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 0.9em; width: 200px;
        }
        .account-bar input:focus { outline: none; border-color: var(--accent); }
        .account-bar .bound-nick { color: var(--gold); font-weight: 700; }
        .reset-btn {
            background: rgba(233,69,96,0.2); border: 1px solid var(--accent); color: var(--accent);
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: inherit;
            font-size: 0.85em; font-weight: 600; transition: 0.2s;
        }
        .reset-btn:hover { background: var(--accent); color: white; }
        .bought-bar {
            background: rgba(255,215,0,0.08); padding: 12px 20px;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            justify-content: center; border-bottom: 1px solid var(--border);
        }
        .bought-bar .label { font-weight: 700; color: var(--gold); font-size: 0.9em; }
        .bought-item {
            background: linear-gradient(135deg, #e94560, #c73650); color: white;
            padding: 5px 14px; border-radius: 20px; font-size: 0.85em; font-weight: 600;
            animation: popIn 0.3s ease;
        }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .tabs {
            display: flex; justify-content: center; gap: 6px;
            padding: 20px 20px 10px; flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent; border: 2px solid var(--border); color: var(--text-dim);
            padding: 12px 30px; cursor: pointer; font-family: inherit; font-size: 1em;
            font-weight: 700; transition: 0.25s; border-radius: 8px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .tab-btn:hover { border-color: var(--accent); color: var(--text); }
        .tab-btn.active {
            background: linear-gradient(135deg, #e94560, #c73650);
            border-color: var(--accent); color: white;
        }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px; padding: 10px 20px 40px; max-width: 1300px; margin: 0 auto;
        }
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 14px;
            overflow: hidden; transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        .card:hover { transform: translateY(-6px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .card-banner {
            height: 90px; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        .card-banner .icon { font-size: 3em; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)); }
        .card-banner .rank-badge {
            position: absolute; top: 8px; left: 12px; font-size: 0.75em;
            font-weight: 800; letter-spacing: 1px; text-transform: uppercase; opacity: 0.7;
        }
        .card-banner .free-badge {
            position: absolute; top: 8px; right: 12px; background: rgba(46,204,113,0.9);
            color: white; padding: 3px 10px; border-radius: 4px; font-size: 0.75em; font-weight: 700;
        }
        .card-body { padding: 16px; text-align: center; }
        .card-body h3 { font-size: 1.3em; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px; }
        .card-body .price { font-size: 1.6em; font-weight: 900; color: var(--gold); margin-bottom: 6px; }
        .card-body .price.free { color: #2ecc71; }
        .card-body .desc { font-size: 0.85em; color: var(--text-dim); margin-bottom: 14px; line-height: 1.6; }
        .card-body .drops { font-size: 0.8em; color: var(--text-dim); margin-bottom: 14px; text-align: left; line-height: 1.7; }
        .card-body .drops .drop-line { display: flex; justify-content: space-between; padding: 2px 0; }
        .card-body .drops .amt { color: var(--text); font-weight: 600; }
        .card-body .drops .ch { color: var(--accent); font-weight: 600; }
        .btn {
            width: 100%; padding: 13px; border: none; border-radius: 8px;
            font-family: inherit; font-size: 1em; font-weight: 700; cursor: pointer;
            transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-free { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; }
        .btn-free:hover { filter: brightness(1.15); }
        .btn-free:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-buy { background: linear-gradient(135deg, #e94560, #c73650); color: white; }
        .btn-buy:hover { filter: brightness(1.15); }
        .btn-done { background: rgba(46,204,113,0.2); border: 1px solid #2ecc71; color: #2ecc71; cursor: default; }
        .btn-current { background: rgba(255,215,0,0.15); border: 1px solid var(--gold); color: var(--gold); cursor: default; }
        .btn-locked { background: #333; color: #666; cursor: not-allowed; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="header">
        <h1>DELAYED</h1>
        <div class="sub">Сервер с уникальной экономикой времени</div>
    </div>
    <div class="account-bar">
        <span style="color:var(--text-dim); font-size:0.85em;">Minecraft ник:</span>
        <input type="text" id="mc-nick" placeholder="Введите ник" oninput="onNickInput()">
        <span id="bound-status" style="font-size:0.85em; color:var(--text-dim);"></span>
        <button class="reset-btn" onclick="resetAll()">Сбросить всё</button>
    </div>
    <div class="bought-bar" id="bought-bar">
        <span class="label">Куплено:</span>
        <span id="bought-list" style="color:var(--text-dim); font-size:0.85em;">пока ничего</span>
    </div>
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('privileges', this)">Привилегии</button>
        <button class="tab-btn" onclick="showTab('cases', this)">Сундуки</button>
        <button class="tab-btn" onclick="showTab('services', this)">Услуги</button>
        <button class="tab-btn" onclick="showTab('history', this)">История</button>
    </div>
    <div id="privileges" class="grid"></div>
    <div id="cases" class="grid" style="display:none;"></div>
    <div id="services" class="grid" style="display:none;"></div>
    <div id="history" class="grid" style="display:none; grid-template-columns: 1fr; max-width: 700px;">
        <div id="history-list" style="background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px;"></div>
    </div>
    <script>
        const RANKS = [
            {name:"HERO",id:"hero",icon:"⚔️",color:"#7f8c8d",
             gradient:"linear-gradient(135deg, #636e72, #2c3e50)",price:"0 ₽",free:true,
             desc:"/kit hero, /craft, /recipe, /getpos, 5 слотов аукциона, 2 привата"},
            {name:"TITAN",id:"titan",icon:"⚜️",color:"#3498db",
             gradient:"linear-gradient(135deg, #2980b9, #1a5276)",price:"0 ₽",free:true,
             desc:"+ /kit titan, /hat, /feed, /rtpfar, /itemdb, 7 слотов, 4 привата"},
            {name:"AVENGER",id:"avenger",icon:"⚓️",color:"#9b59b6",
             gradient:"linear-gradient(135deg, #8e44ad, #5b2c6f)",price:"0 ₽",free:true,
             desc:"+ /kit avenger, /enderchest, /ext, /ignore, /clear, 9 слотов, 8 приватов, 6 домов"},
            {name:"OVERLORD",id:"overlord",icon:"👑",color:"#e67e22",
             gradient:"linear-gradient(135deg, #d35400, #873600)",price:"0 ₽",free:true,
             desc:"+ /kit overlord, /prefix, /repair, /near, /ptime, x2 валюты, 14 слотов, 16 приватов, 12 домов"},
            {name:"MAGISTER",id:"magister",icon:"🧙",color:"#1abc9c",
             gradient:"linear-gradient(135deg, #16a085, #0e6655)",price:"0 ₽",free:true,
             desc:"+ /kit magister, /nick, /invsee, /repair all, /heal, /tptoggle, 22 слота, 48 приватов, 32 дома"},
            {name:"IMPERATOR",id:"imperator",icon:"👔",color:"#e74c3c",
             gradient:"linear-gradient(135deg, #c0392b, #641e16)",price:"0 ₽",free:true,
             desc:"+ /kit imperator, /kit plus, /broadcast, /realname, /lightning, /rtp, x4 валюты, 36 слотов, 96 приватов, 48 домов"},
            {name:"DRAGON",id:"dragon",icon:"🐲",color:"#c0392b",
             gradient:"linear-gradient(135deg, #922b21, #4d1e12)",price:"0 ₽",free:true,
             desc:"+ /kit dragon, /kit pluspro, /fly, /grant, /sun /rain /night /day, x6 валюты, 999 слотов, 999+ приватов, 999+ домов"}
        ];

        const CASES = [
            {name:"Сундук с хронами",icon:"⏱️",
             gradient:"linear-gradient(135deg, #2c3e50, #1a1a2e)",price:"50 ₽",free:false,
             drops:[{amt:"100–500 хронов",ch:"50%"},{amt:"1000–2000 хронов",ch:"30%"},{amt:"2000–5000 хронов",ch:"20%"}]},
            {name:"Сундук с реликами",icon:"💎",
             gradient:"linear-gradient(135deg, #d4af37, #8a7100)",price:"100 ₽",free:false,
             drops:[{amt:"10–100 реликов",ch:"50%"},{amt:"100–300 реликов",ch:"30%"},{amt:"300–500 реликов",ch:"20%"}]}
        ];

        const SERVICES = [
            {name:"Разбан",icon:"🔓",
             gradient:"linear-gradient(135deg, #2c3e50, #1a1a2e)",price:"Бесплатно",free:true,
             desc:"Снимает блокировку входа на сервер. Доступно только с привязанным аккаунтом.",needsAccount:true},
            {name:"Размут",icon:"🗣️",
             gradient:"linear-gradient(135deg, #2c3e50, #1a1a2e)",price:"Бесплатно",free:true,
             desc:"Снимает запрет на использование чата. Доступно только с привязанным аккаунтом.",needsAccount:true},
            {name:"Кожаный сет",icon:"🪁️",
             gradient:"linear-gradient(135deg, #6d4c3d, #3e2723)",price:"Бесплатно",free:true,
             desc:"Кожаная броня + деревянные инструменты + жареная баранина. Одноразовая покупка. В игре можно забирать каждые 30 минут.",needsAccount:false}
        ];

        let state = { nick:"", currentRank:null, leatherKit:false, history:[] };

        function loadState() {
            const saved = localStorage.getItem('delayed_state');
            if (saved) { try { state = Object.assign(state, JSON.parse(saved)); } catch(e) {} }
            if (state.nick) document.getElementById('mc-nick').value = state.nick;
            renderAll();
        }
        function saveState() { localStorage.setItem('delayed_state', JSON.stringify(state)); }
        function resetAll() {
            state = { nick:"", currentRank:null, leatherKit:false, history:[] };
            localStorage.removeItem('delayed_state');
            document.getElementById('mc-nick').value = "";
            renderAll();
        }
        function onNickInput() {
            state.nick = document.getElementById('mc-nick').value.trim();
            saveState();
            renderServices(); updateBoundStatus();
        }
        function updateBoundStatus() {
            const el = document.getElementById('bound-status');
            if (state.nick) el.innerHTML = 'Привязан: <span class="bound-nick">'+state.nick+'</span>';
            else el.textContent = 'не привязан';
        }
        function showTab(tab, btn) {
            document.querySelectorAll('.grid').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).style.display = 'grid';
            btn.classList.add('active');
        }
        function renderPrivileges() {
            const c = document.getElementById('privileges'); c.innerHTML = '';
            RANKS.forEach((r, i) => {
                const isCurrent = state.currentRank === r.id;
                const isOwned = state.currentRank && RANKS.findIndex(x => x.id === state.currentRank) >= i;
                let btn;
                if (isCurrent) btn = '<button class="btn btn-current">Текущий ранг ✓</button>';
                else if (isOwned) btn = '<button class="btn btn-done" disabled>Куплено ✓</button>';
                else btn = '<button class="btn btn-free" onclick="buyRank('+i+')">Бесплатно</button>';
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML =
                    '<div class="card-banner" style="background:'+r.gradient+'">'+
                    '<span class="rank-badge" style="color:'+r.color+';">'+r.name+'</span>'+
                    (r.free?'<span class="free-badge">БЕСПЛАТНО</span>':'')+
                    '<span class="icon">'+r.icon+'</span></div>'+
                    '<div class="card-body"><h3 style="color:'+r.color+';">'+r.name+'</h3>'+
                    '<div class="price free">'+r.price+'</div>'+
                    '<div class="desc">'+r.desc+'</div>'+btn+'</div>';
                c.appendChild(card);
            });
        }
        function buyRank(index) {
            const r = RANKS[index];
            if (state.currentRank) {
                const oi = RANKS.findIndex(x => x.id === state.currentRank);
                addHistory(RANKS[oi].name+' (заменён)','0 ₽');
            }
            state.currentRank = r.id;
            addHistory(r.name, '0 ₽');
            saveState(); renderAll();
        }
        function renderCases() {
            const c = document.getElementById('cases'); c.innerHTML = '';
            CASES.forEach((cs, i) => {
                let dh = '';
                cs.drops.forEach(d => { dh += '<div class="drop-line"><span class="amt">'+d.amt+'</span><span class="ch">'+d.ch+'</span></div>'; });
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML =
                    '<div class="card-banner" style="background:'+cs.gradient+'">'+
                    '<span class="icon">'+cs.icon+'</span></div>'+
                    '<div class="card-body"><h3>'+cs.name+'</h3>'+
                    '<div class="price">'+cs.price+'</div>'+
                    '<div class="drops">'+dh+'</div>'+
                    '<button class="btn btn-buy" id="case-btn-'+i+'" onclick="buyCase('+i+')">Купить</button></div>';
                c.appendChild(card);
            });
        }
        function buyCase(index) {
            const cs = CASES[index];
            const btn = document.getElementById('case-btn-'+index);
            btn.textContent = 'Куплено ✓'; btn.className = 'btn btn-done';
            addHistory(cs.name, cs.price); saveState();
            setTimeout(() => { btn.textContent = 'Купить'; btn.className = 'btn btn-buy'; }, 1500);
            renderHistory();
        }
        function renderServices() {
            const c = document.getElementById('services'); c.innerHTML = '';
            SERVICES.forEach((s, i) => {
                const isLeather = s.name === 'Кожаный сет';
                const isOwned = isLeather && state.leatherKit;
                const isLocked = s.needsAccount && !state.nick;
                let btn;
                if (isOwned) btn = '<button class="btn btn-done" disabled>Получено ✓</button>';
                else if (isLocked) btn = '<button class="btn btn-locked" disabled>Привяжите аккаунт</button>';
                else btn = '<button class="btn btn-free" onclick="buyService('+i+')">Бесплатно</button>';
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML =
                    '<div class="card-banner" style="background:'+s.gradient+'">'+
                    (s.free?'<span class="free-badge">БЕСПЛАТНО</span>':'')+
                    '<span class="icon">'+s.icon+'</span></div>'+
                    '<div class="card-body"><h3>'+s.name+'</h3>'+
                    '<div class="price free">'+s.price+'</div>'+
                    '<div class="desc">'+s.desc+'</div>'+btn+'</div>';
                c.appendChild(card);
            });
        }
        function buyService(index) {
            const s = SERVICES[index];
            if (s.name === 'Кожаный сет') state.leatherKit = true;
            addHistory(s.name, '0 ₽'); saveState(); renderAll();
        }
        function addHistory(name, price) {
            const now = new Date();
            const ds = now.toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
            state.history.unshift({name,price,date:ds});
            if (state.history.length > 50) state.history.pop();
        }
        function renderHistory() {
            const el = document.getElementById('history-list');
            if (state.history.length === 0) { el.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:30px;">История пуста</div>'; return; }
            let h = '<div style="font-weight:700;margin-bottom:15px;color:var(--gold);">История покупок</div>';
            state.history.forEach(item => {
                h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">'+
                    '<div><div style="font-weight:600;">'+item.name+'</div>'+
                    '<div style="font-size:0.8em;color:var(--text-dim);">'+item.date+'</div></div>'+
                    '<div style="color:'+(item.price==='0 ₽'?'#2ecc71':'var(--gold)')+';font-weight:700;">'+item.price+'</div></div>';
            });
            el.innerHTML = h;
        }
        function renderBought() {
            const el = document.getElementById('bought-list');
            const items = [];
            if (state.currentRank) { const r = RANKS.find(x => x.id === state.currentRank); items.push(r.name); }
            if (state.leatherKit) items.push('Кожаный сет');
            if (items.length === 0) { el.textContent = 'пока ничего'; el.style.color = 'var(--text-dim)'; }
            else el.innerHTML = items.map(i => '<span class="bought-item">'+i+'</span>').join(' ');
        }
        function renderAll() {
            renderPrivileges(); renderCases(); renderServices();
            renderHistory(); renderBought(); updateBoundStatus();
        }
        loadState();
    </script>
</body>
</html>
