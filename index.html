<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delayed | Магазин</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f0f1e; color: #fff; min-height: 100vh; }

/* Шапка */
.header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: #16162e; border-bottom: 1px solid #2a2a4a; }
.header h1 { font-size: 1.4em; letter-spacing: 2px; color: #e94560; }
.header-actions { display: flex; gap: 10px; align-items: center; }
.nick-display { background: #1e1e3a; padding: 8px 14px; border-radius: 6px; font-size: 0.85em; }
.nick-display.linked { color: #2ecc71; border: 1px solid #2ecc71; }
.btn-link { background: #e94560; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85em; }
.btn-link:hover { background: #c73e54; }
.btn-reset { background: #2a2a4a; color: #aaa; border: 1px solid #444; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85em; }
.btn-reset:hover { background: #e94560; color: #fff; border-color: #e94560; }

/* Куплено */
.bought-bar { background: #12122a; padding: 12px 25px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #2a2a4a; }
.bought-bar strong { color: #888; font-size: 0.9em; }
.bought-tag { background: #e94560; padding: 4px 12px; border-radius: 20px; font-size: 0.8em; }
.bought-tag.rank { background: #f39c12; }
.bought-tag.set { background: #2ecc71; }
.bought-count { color: #666; font-size: 0.85em; }

/* Вкладки */
.tabs { display: flex; justify-content: center; gap: 8px; padding: 18px 0; }
.tab-btn { background: transparent; border: 1px solid #3a3a5a; color: #aaa; padding: 8px 22px; border-radius: 6px; cursor: pointer; font-size: 0.95em; transition: 0.2s; }
.tab-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
.tab-btn:hover:not(.active) { border-color: #e94560; color: #fff; }

/* Сетка */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; padding: 0 25px 40px; max-width: 1200px; margin: 0 auto; }
.card { background: #1a1a36; border: 1px solid #2a2a4a; border-radius: 12px; padding: 20px; text-align: center; position: relative; transition: 0.2s; }
.card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); border-color: #3a3a6a; }
.card-icon { font-size: 3em; margin-bottom: 10px; display: block; }
.card-title { font-size: 1.15em; margin-bottom: 8px; }
.card-price { font-size: 1.4em; font-weight: bold; margin-bottom: 6px; }
.card-price.free { color: #2ecc71; }
.card-price.paid { color: #e94560; }
.card-desc { font-size: 0.82em; color: #888; margin-bottom: 15px; line-height: 1.4; }
.badge-free { position: absolute; top: 10px; right: 10px; background: #2ecc71; color: #fff; padding: 3px 10px; border-radius: 4px; font-size: 0.75em; font-weight: bold; }
.action-btn { width: 100%; padding: 11px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95em; transition: 0.2s; }
.action-btn.free { background: #fff; color: #000; }
.action-btn.free:hover { background: #ddd; }
.action-btn.paid { background: #e94560; color: #fff; }
.action-btn.paid:hover { background: #c73e54; }
.action-btn.disabled { background: #333; color: #666; cursor: not-allowed; }
.action-btn.done { background: #2ecc71; color: #fff; cursor: default; }

/* Модалки */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
.modal-overlay.show { display: flex; }
.modal { background: #1a1a36; border: 1px solid #3a3a6a; border-radius: 14px; padding: 25px; max-width: 420px; width: 90%; }
.modal h3 { margin-bottom: 18px; text-align: center; }
.modal-btn { display: block; width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 1em; font-weight: bold; transition: 0.2s; }
.modal-btn.self { background: #e94560; color: #fff; }
.modal-btn.self:hover { background: #c73e54; }
.modal-btn.other { background: #3a3a6a; color: #fff; }
.modal-btn.other:hover { background: #4a4a7a; }
.modal-btn.close { background: transparent; color: #888; border: 1px solid #444; }
.modal-btn.close:hover { color: #fff; border-color: #888; }
.modal-error { color: #e94560; text-align: center; font-size: 0.9em; margin-top: 10px; display: none; }
.modal-error.show { display: block; }

/* Поиск игроков */
.search-input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #3a3a5a; background: #0f0f1e; color: #fff; font-size: 0.95em; }
.player-list { max-height: 350px; overflow-y: auto; }
.player-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: #12122a; border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; border: 1px solid #2a2a4a; }
.player-card:hover { border-color: #e94560; }
.player-card.disabled { opacity: 0.4; cursor: not-allowed; }
.player-card.disabled:hover { border-color: #2a2a4a; }
.player-avatar { width: 48px; height: 48px; border-radius: 6px; background: #2a2a4a; display: flex; align-items: center; justify-content: center; font-size: 2em; flex-shrink: 0; }
.player-info { flex: 1; }
.player-nick { font-weight: bold; font-size: 1em; }
.player-rank { font-size: 0.8em; margin-top: 2px; padding: 2px 8px; border-radius: 3px; display: inline-block; }
.player-stats { font-size: 0.75em; color: #888; margin-top: 4px; }
.player-already { font-size: 0.8em; color: #2ecc71; font-weight: bold; }

/* История */
.history-list { max-width: 800px; margin: 0 auto; padding: 0 25px 40px; }
.history-item { background: #1a1a36; border: 1px solid #2a2a4a; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.history-name { font-weight: bold; }
.history-to { color: #888; font-size: 0.85em; }
.history-date { color: #555; font-size: 0.8em; }
.no-history { text-align: center; color: #555; padding: 40px; }
</style>
</head>
<body>

<div class="header">
  <h1>DELAYED</h1>
  <div class="header-actions">
    <span class="nick-display" id="nickDisplay" style="display:none;"></span>
    <button class="btn-link" id="btnLink" onclick="openLinkModal()">Привязать аккаунт</button>
    <button class="btn-reset" onclick="resetAll()">Сбросить всё</button>
  </div>
</div>

<div class="bought-bar" id="boughtBar">
  <strong>Куплено:</strong>
  <span class="bought-count" id="boughtCount">пусто</span>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('privileges', this)">Привилегии</button>
  <button class="tab-btn" onclick="showTab('cases', this)">Кейсы</button>
  <button class="tab-btn" onclick="showTab('services', this)">Услуги</button>
  <button class="tab-btn" onclick="showTab('history', this)">История</button>
</div>

<!-- Привилегии -->
<div id="privileges" class="grid"></div>
<!-- Кейсы -->
<div id="cases" class="grid" style="display:none;"></div>
<!-- Услуги -->
<div id="services" class="grid" style="display:none;"></div>
<!-- История -->
<div id="history" class="history-list" style="display:none;">
  <div class="no-history" id="noHistory">Пока пусто</div>
</div>

<!-- Модалка привязки -->
<div class="modal-overlay" id="linkModal">
  <div class="modal">
    <h3>Привязка аккаунта</h3>
    <input class="search-input" id="linkNick" placeholder="Ник Minecraft (3-16 символов)" maxlength="16">
    <input class="search-input" id="linkPass" placeholder="Пароль (для сервера)" type="password">
    <button class="modal-btn self" onclick="doLink()">Привязать</button>
    <button class="modal-btn close" onclick="closeModal('linkModal')">Отмена</button>
    <div class="modal-error" id="linkError"></div>
  </div>
</div>

<!-- Модалка покупки -->
<div class="modal-overlay" id="buyModal">
  <div class="modal">
    <h3 id="buyModalTitle">Покупка</h3>
    <button class="modal-btn self" onclick="buySelf()">Купить себе</button>
    <button class="modal-btn other" onclick="buyOther()">Купить кому-то</button>
    <button class="modal-btn close" onclick="closeModal('buyModal')">Отмена</button>
    <div class="modal-error" id="buyError"></div>
  </div>
</div>

<!-- Модалка поиска игроков -->
<div class="modal-overlay" id="searchModal">
  <div class="modal" style="max-width:500px;">
    <h3>Выберите игрока</h3>
    <input class="search-input" id="searchInput" placeholder="Введите ник (пусто = все)" oninput="renderPlayers()">
    <div class="player-list" id="playerList"></div>
    <button class="modal-btn close" onclick="closeModal('searchModal')">Отмена</button>
  </div>
</div>

<!-- Модалка подтверждения -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <h3 id="confirmTitle">Подтверждение</h3>
    <p style="text-align:center;margin-bottom:18px;" id="confirmText"></p>
    <button class="modal-btn self" onclick="confirmPurchase()">Подтвердить</button>
    <button class="modal-btn close" onclick="closeModal('confirmModal')">Отмена</button>
  </div>
</div>

<script>
// Данные
const RANKS = [
  {id:'hero',name:'HERO',icon:'⚔️',color:'#888',desc:'/kit hero, /craft, 5 слотов аука, 2 привата'},
  {id:'titan',name:'TITAN',icon:'🔼',color:'#3498db',desc:'+ /hat, /feed, /rtpfar, 7 слотов, 4 привата'},
  {id:'avenger',name:'AVENGER',icon:'⚓',color:'#9b59b6',desc:'+ /enderchest, /ext, /ignore, 8 приватов'},
  {id:'overlord',name:'OVERLORD',icon:'👑',color:'#e67e22',desc:'+ /prefix, /repair, /near, x2 валюты, 16 приватов'},
  {id:'magister',name:'MAGISTER',icon:'🧙',color:'#1abc9c',desc:'+ /nick, /invsee, /heal, /tptoggle, 48 приватов'},
  {id:'imperator',name:'IMPERATOR',icon:'💼',color:'#e74c3c',desc:'+ /broadcast, /lightning, /rtp, x4 валюты, 96 приватов'},
  {id:'dragon',name:'DRAGON',icon:'🐲',color:'#992222',desc:'+ /fly, /grant, погода, x6 валюты, 999+ приватов'}
];
const RANK_ORDER = {hero:0,titan:1,avenger:2,overlord:3,magister:4,imperator:5,dragon:6};

const CASES = [
  {id:'chrones',name:'Сундук с хронами',icon:'⏱️',price:50,desc:'100-500 (50%), 1000-2000 (30%), 2000-5000 (20%)'},
  {id:'delics',name:'Сундук с диликами',icon:'💎',price:100,desc:'10-100 (50%), 100-300 (30%), 300-500 (20%)'}
];

const SERVICES = [
  {id:'unban',name:'Разбан',icon:'🔓',price:0,desc:'Снятие бана',oneTime:false},
  {id:'unmute',name:'Размут',icon:'💬',price:0,desc:'Снятие мута',oneTime:false},
  {id:'leather_set',name:'Кожаный сет',icon:'🛡️',price:0,desc:'Кожаная броня + деревянные инструменты + жареная баранина. Можно забирать каждые 30 мин.',oneTime:true}
];

// Тестовые игроки
let PLAYERS = [
  {nick:'Nokia',avatar:'🧑',rank:'hero',chrones:10,delics:11,playtime:'3 часа',hasSet:false}
];

// Состояние
let state = {
  linkedNick: null,
  myRank: null,
  mySet: false,
  history: [],
  // что куплено другим игрокам
  gifts: {}
};

let currentBuyItem = null;

// Загрузка
function loadState() {
  const s = localStorage.getItem('delayed_state_v2');
  if (s) {
    const parsed = JSON.parse(s);
    state = {...state, ...parsed};
  }
  // Восстанавливаем данные игроков из подарков
  if (state.gifts) {
    for (const nick in state.gifts) {
      let p = PLAYERS.find(x => x.nick === nick);
      if (p) {
        if (state.gifts[nick].rank) p.rank = state.gifts[nick].rank;
        if (state.gifts[nick].hasSet) p.hasSet = true;
      }
    }
  }
}

function saveState() {
  localStorage.setItem('delayed_state_v2', JSON.stringify(state));
}

// Сброс
function resetAll() {
  localStorage.removeItem('delayed_state_v2');
  state = { linkedNick: null, myRank: null, mySet: false, history: [], gifts: {} };
  PLAYERS = [{nick:'Nokia',avatar:'🧑',rank:'hero',chrones:10,delics:11,playtime:'3 часа',hasSet:false}];
  renderAll();
}

// Вкладки
function showTab(tab, btn) {
  document.querySelectorAll('.grid, .history-list').forEach(el => el.style.display = 'none');
  document.getElementById(tab).style.display = tab === 'history' ? 'block' : 'grid';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// Рендер привилегий
function renderPrivileges() {
  const el = document.getElementById('privileges');
  el.innerHTML = '';
  RANKS.forEach(r => {
    const isMine = state.myRank === r.id;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <span class="card-icon">${r.icon}</span>
      <div class="card-title" style="color:${r.color};">${r.name}</div>
      <div class="card-price free">Бесплатно</div>
      <div class="card-desc">${r.desc}</div>
      <button class="action-btn ${isMine ? 'done' : 'free'}" ${isMine ? 'disabled' : ''} onclick="startBuy('rank','${r.id}')">
        ${isMine ? 'Текущий ранг ✓' : 'Бесплатно'}
      </button>
    `;
    el.appendChild(card);
  });
}

// Рендер кейсов
function renderCases() {
  const el = document.getElementById('cases');
  el.innerHTML = '';
  CASES.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <span class="card-icon">${c.icon}</span>
      <div class="card-title">${c.name}</div>
      <div class="card-price paid">${c.price} ₽</div>
      <div class="card-desc">${c.desc}</div>
      <button class="action-btn paid" onclick="startBuy('case','${c.id}')">Купить</button>
    `;
    el.appendChild(card);
  });
}

// Рендер услуг
function renderServices() {
  const el = document.getElementById('services');
  el.innerHTML = '';
  SERVICES.forEach(s => {
    const isMine = s.oneTime && state.mySet && s.id === 'leather_set';
    const needsAccount = s.id === 'unban' || s.id === 'unmute';
    const locked = needsAccount && !state.linkedNick;
    let btnClass = 'free';
    let btnText = 'Бесплатно';
    if (isMine) { btnClass = 'done'; btnText = 'Получено ✓'; }
    if (locked) { btnClass = 'disabled'; btnText = 'Нужен аккаунт'; }
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <span class="badge-free">БЕСПЛАТНО</span>
      <span class="card-icon">${s.icon}</span>
      <div class="card-title">${s.name}</div>
      <div class="card-price free">Бесплатно</div>
      <div class="card-desc">${s.desc}</div>
      <button class="action-btn ${btnClass}" ${isMine || locked ? 'disabled' : ''} onclick="startBuy('service','${s.id}')">${btnText}</button>
    `;
    el.appendChild(card);
  });
}

// Рендер куплено
function renderBought() {
  const el = document.getElementById('boughtBar');
  let html = '<strong>Куплено:</strong>';
  let count = 0;
  if (state.myRank) {
    const r = RANKS.find(x => x.id === state.myRank);
    html += `<span class="bought-tag rank">${r.name}</span>`;
    count++;
  }
  if (state.mySet) {
    html += '<span class="bought-tag set">Кожаный сет</span>';
    count++;
  }
  if (count === 0) html += '<span class="bought-count">пусто</span>';
  document.getElementById('boughtBar').innerHTML = html;
}

// Рендер истории
function renderHistory() {
  const el = document.getElementById('history');
  if (state.history.length === 0) {
    el.innerHTML = '<div class="no-history">Пока пусто</div>';
    return;
  }
  el.innerHTML = '';
  state.history.forEach(h => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <div>
        <span class="history-name">${h.item}</span>
        <span class="history-to">→ ${h.to}</span>
      </div>
      <span class="history-date">${h.date}</span>
    `;
    el.appendChild(item);
  });
}

// Рендер шапки
function renderHeader() {
  const nd = document.getElementById('nickDisplay');
  const bl = document.getElementById('btnLink');
  if (state.linkedNick) {
    nd.style.display = 'inline-block';
    nd.className = 'nick-display linked';
    nd.textContent = 'Аккаунт: ' + state.linkedNick;
    bl.style.display = 'none';
  } else {
    nd.style.display = 'none';
    bl.style.display = 'inline-block';
  }
}

function renderAll() {
  renderHeader();
  renderPrivileges();
  renderCases();
  renderServices();
  renderBought();
  renderHistory();
}

// Модалки
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function openLinkModal() {
  document.getElementById('linkNick').value = '';
  document.getElementById('linkPass').value = '';
  document.getElementById('linkError').classList.remove('show');
  openModal('linkModal');
}

function doLink() {
  const nick = document.getElementById('linkNick').value.trim();
  const pass = document.getElementById('linkPass').value.trim();
  const err = document.getElementById('linkError');
  if (nick.length < 3 || nick.length > 16) {
    err.textContent = 'Ник: 3-16 символов';
    err.classList.add('show');
    return;
  }
  if (pass.length < 1) {
    err.textContent = 'Введите пароль';
    err.classList.add('show');
    return;
  }
  state.linkedNick = nick;
  saveState();
  renderAll();
  closeModal('linkModal');
}

// Начало покупки
function startBuy(type, id) {
  currentBuyItem = {type, id};
  document.getElementById('buyError').classList.remove('show');
  const item = getItem(type, id);
  document.getElementById('buyModalTitle').textContent = item.name;
  openModal('buyModal');
}

function getItem(type, id) {
  if (type === 'rank') return RANKS.find(r => r.id === id);
  if (type === 'case') return CASES.find(c => c.id === id);
  if (type === 'service') return SERVICES.find(s => s.id === id);
}

// Купить себе
function buySelf() {
  const err = document.getElementById('buyError');
  if (!state.linkedNick) {
    err.textContent = 'Невозможно купить: аккаунт не привязан';
    err.classList.add('show');
    return;
  }
  doPurchase(state.linkedNick);
}

// Купить кому-то
function buyOther() {
  closeModal('buyModal');
  document.getElementById('searchInput').value = '';
  renderPlayers();
  openModal('searchModal');
}

// Рендер списка игроков
function renderPlayers() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const list = document.getElementById('playerList');
  list.innerHTML = '';
  let filtered = query ? PLAYERS.filter(p => p.nick.toLowerCase().includes(query)) : PLAYERS;
  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#555;padding:20px;">Никто не найден</div>';
    return;
  }
  filtered.forEach(p => {
    const rankInfo = RANKS.find(r => r.id === p.rank) || {name:'Игрок',color:'#888'};
    const item = currentBuyItem;
    let alreadyHas = false;
    let alreadyText = '';
    if (item) {
      if (item.type === 'rank') {
        const targetRank = RANK_ORDER[item.id];
        const playerRank = RANK_ORDER[p.rank] || -1;
        if (playerRank >= targetRank) {
          alreadyHas = true;
          alreadyText = 'Уже есть ранг выше или равный';
        }
      } else if (item.type === 'service' && item.id === 'leather_set') {
        if (p.hasSet) {
          alreadyHas = true;
          alreadyText = 'Уже куплено ✓';
        }
      }
    }
    const card = document.createElement('div');
    card.className = 'player-card' + (alreadyHas ? ' disabled' : '');
    card.innerHTML = `
      <div class="player-avatar">${p.avatar}</div>
      <div class="player-info">
        <div class="player-nick">${p.nick}</div>
        <span class="player-rank" style="background:${rankInfo.color || '#888'};color:#fff;">${rankInfo.name || 'Игрок'}</span>
        <div class="player-stats">⏱️ ${p.chrones} хронов | 💎 ${p.delics} диликов | 🎮 ${p.playtime}</div>
      </div>
      ${alreadyHas ? '<div class="player-already">' + alreadyText + '</div>' : ''}
    `;
    if (!alreadyHas) {
      card.onclick = function() { selectPlayer(p.nick); };
    }
    list.appendChild(card);
  });
}

// Выбор игрока
function selectPlayer(nick) {
  closeModal('searchModal');
  const item = getItem(currentBuyItem.type, currentBuyItem.id);
  document.getElementById('confirmText').textContent = 'Купить "' + item.name + '" для игрока ' + nick + '?';
  document.getElementById('confirmTitle').textContent = 'Подтверждение';
  openModal('confirmModal');
  window._confirmNick = nick;
}

// Подтверждение покупки
function confirmPurchase() {
  doPurchase(window._confirmNick);
}

// Сама покупка
function doPurchase(targetNick) {
  const item = currentBuyItem;
  if (!item) return;
  
  // Записываем в историю
  const now = new Date();
  const dateStr = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
  state.history.unshift({item: item.name, to: targetNick, date: dateStr});
  
  const isSelf = (targetNick === state.linkedNick);
  
  if (item.type === 'rank') {
    if (isSelf) {
      state.myRank = item.id;
    } else {
      // Покупка другому — обновляем ранг игрока
      let p = PLAYERS.find(x => x.nick === targetNick);
      if (p) p.rank = item.id;
      if (!state.gifts[targetNick]) state.gifts[targetNick] = {};
      state.gifts[targetNick].rank = item.id;
    }
  } else if (item.type === 'service' && item.id === 'leather_set') {
    if (isSelf) {
      state.mySet = true;
    } else {
      let p = PLAYERS.find(x => x.nick === targetNick);
      if (p) p.hasSet = true;
      if (!state.gifts[targetNick]) state.gifts[targetNick] = {};
      state.gifts[targetNick].hasSet = true;
    }
  }
  
  saveState();
  renderAll();
  closeModal('buyModal');
  closeModal('confirmModal');
}

// Старт
loadState();
renderAll();
</script>
</body>
</html>
