<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delayed | Магазин</title>
<style>
:root {
--bg: #0f0f23;
--card: #1a1a3e;
--accent: #e94560;
--gold: #ffd700;
--green: #2ecc71;
--text: #ffffff;
--sec: #888;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Segoe UI', sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
padding: 20px;
}

/* Шапка */
.header {
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
gap: 15px;
margin-bottom: 20px;
}
.header-left h1 {
font-size: 1.8em;
letter-spacing: 4px;
text-transform: uppercase;
}
.header-left p {
color: var(--accent);
font-size: 0.85em;
margin-top: 3px;
}
.header-right {
display: flex;
gap: 10px;
align-items: center;
flex-wrap: wrap;
}
.link-btn {
padding: 8px 16px;
border: 1px solid var(--accent);
background: transparent;
color: var(--text);
border-radius: 6px;
cursor: pointer;
font-size: 0.9em;
transition: 0.2s;
}
.link-btn:hover { background: var(--accent); }
.link-btn.reset { border-color: #555; color: var(--sec); }
.link-btn.reset:hover { border-color: #f00; color: #f00; background: transparent; }
.account-badge {
padding: 8px 16px;
background: var(--green);
color: #000;
border-radius: 6px;
font-weight: bold;
font-size: 0.9em;
}

/* Полоса купленного */
.bought-bar {
background: rgba(255,255,255,0.05);
padding: 12px 16px;
border-radius: 8px;
margin-bottom: 20px;
display: flex;
align-items: center;
gap: 10px;
flex-wrap: wrap;
}
.bought-bar strong { font-size: 0.9em; color: var(--sec); }
.bought-item {
padding: 4px 12px;
border-radius: 20px;
font-size: 0.85em;
animation: popIn 0.3s;
}
.bought-item.rank {
background: var(--gold);
color: #000;
}
.bought-item.set {
background: var(--accent);
color: #fff;
}
@keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

/* Вкладки */
.tabs {
display: flex;
justify-content: center;
gap: 8px;
margin-bottom: 24px;
flex-wrap: wrap;
}
.tab-btn {
padding: 10px 22px;
background: transparent;
border: 1px solid #444;
color: var(--text);
border-radius: 6px;
cursor: pointer;
font-size: 0.95em;
transition: 0.2s;
}
.tab-btn.active {
background: var(--accent);
border-color: var(--accent);
}

/* Сетка */
.grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
gap: 18px;
max-width: 1100px;
margin: 0 auto;
}
.grid.hidden { display: none; }

/* Карточка */
.card {
background: var(--card);
border: 1px solid #2a2a4e;
border-radius: 12px;
padding: 20px;
text-align: center;
position: relative;
transition: transform 0.2s, box-shadow 0.2s;
}
.card:hover {
transform: translateY(-4px);
box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}
.card-icon {
font-size: 2.5em;
margin-bottom: 8px;
display: block;
}
.card-name {
font-size: 1.15em;
font-weight: bold;
margin-bottom: 6px;
}
.card-price {
font-size: 1.3em;
font-weight: bold;
margin: 8px 0;
}
.card-price.free { color: var(--green); }
.card-price.paid { color: var(--gold); }
.card-desc {
font-size: 0.8em;
color: var(--sec);
margin-bottom: 14px;
min-height: 36px;
}
.card-btn {
width: 100%;
padding: 11px;
border: none;
border-radius: 6px;
font-weight: bold;
cursor: pointer;
font-size: 0.95em;
transition: 0.2s;
}
.card-btn.free {
background: var(--green);
color: #000;
}
.card-btn.free:hover { background: #27ae60; }
.card-btn.paid {
background: var(--gold);
color: #000;
}
.card-btn.paid:hover { background: #e6c200; }
.card-btn.current {
background: #333;
color: var(--sec);
cursor: default;
}
.card-btn.locked {
background: #222;
color: #555;
cursor: not-allowed;
}

/* Бейдж */
.badge {
position: absolute;
top: 10px;
right: 10px;
padding: 3px 8px;
border-radius: 4px;
font-size: 0.72em;
font-weight: bold;
}
.badge.locked-badge {
background: #333;
color: #666;
}

/* Модалка */
.modal-overlay {
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
background: rgba(0,0,0,0.7);
display: none;
justify-content: center;
align-items: center;
z-index: 100;
}
.modal-overlay.show { display: flex; }
.modal {
background: var(--card);
border: 1px solid #444;
border-radius: 14px;
padding: 28px;
max-width: 420px;
width: 90%;
text-align: center;
}
.modal h3 {
font-size: 1.2em;
margin-bottom: 20px;
}
.modal-btn {
display: block;
width: 100%;
padding: 14px;
margin-bottom: 10px;
border: none;
border-radius: 8px;
font-size: 1em;
font-weight: bold;
cursor: pointer;
transition: 0.2s;
}
.modal-btn.self { background: var(--accent); color: #fff; }
.modal-btn.self:hover { background: #c73e54; }
.modal-btn.other { background: #2a2a4e; color: var(--text); border: 1px solid #444; }
.modal-btn.other:hover { background: #3a3a5e; }
.modal-btn.close { background: transparent; color: var(--sec); border: 1px solid #444; }
.modal-error {
color: #f44;
font-size: 0.9em;
margin-top: 10px;
display: none;
}
.modal-error.show { display: block; }

/* Поиск игроков */
.search-input {
width: 100%;
padding: 10px 14px;
background: #0a0a1e;
border: 1px solid #444;
color: var(--text);
border-radius: 6px;
font-size: 0.95em;
margin-bottom: 14px;
}
.player-list {
max-height: 300px;
overflow-y: auto;
}
.player-card {
display: flex;
align-items: center;
gap: 12px;
padding: 12px;
background: #0a0a1e;
border: 1px solid #333;
border-radius: 8px;
margin-bottom: 8px;
cursor: pointer;
transition: 0.2s;
}
.player-card:hover { border-color: var(--accent); }
.player-card.disabled { opacity: 0.4; cursor: not-allowed; }
.player-avatar {
width: 48px;
height: 48px;
border-radius: 6px;
background: #2a2a4e;
display: flex;
align-items: center;
justify-content: center;
font-size: 1.8em;
}
.player-info { flex: 1; text-align: left; }
.player-nick { font-weight: bold; font-size: 1em; }
.player-rank { font-size: 0.8em; margin-top: 2px; }
.player-stats { font-size: 0.75em; color: var(--sec); margin-top: 2px; }
.player-note { font-size: 0.75em; color: var(--green); }

/* История */
.history-list {
max-width: 700px;
margin: 0 auto;
}
.history-item {
background: #0a0a1e;
border: 1px solid #333;
border-radius: 8px;
padding: 12px 16px;
margin-bottom: 8px;
display: flex;
justify-content: space-between;
align-items: center;
}
.history-text { font-size: 0.9em; }
.history-text .item-name { font-weight: bold; }
.history-text .item-recipient { color: var(--sec); }
.history-date { font-size: 0.75em; color: #555; }

</style>
</head>
<body>

<div class="header">
<div class="header-left">
<h1>DELAYED</h1>
<p>Сервер с уникальной экономикой времени</p>
</div>
<div class="header-right" id="header-right">
<button class="link-btn" onclick="openLinkModal()">Привязать аккаунт</button>
<button class="link-btn reset" onclick="resetAll()">Сбросить всё</button>
</div>
</div>

<div class="bought-bar" id="bought-bar">
<strong>Куплено:</strong>
</div>

<div class="tabs">
<button class="tab-btn active" onclick="switchTab('privileges', this)">Привилегии</button>
<button class="tab-btn" onclick="switchTab('cases', this)">Сундуки</button>
<button class="tab-btn" onclick="switchTab('services', this)">Услуги</button>
<button class="tab-btn" onclick="switchTab('history', this)">История</button>
</div>

<!-- Привилегии -->
<div id="privileges" class="grid"></div>
<!-- Сундуки -->
<div id="cases" class="grid hidden"></div>
<!-- Услуги -->
<div id="services" class="grid hidden"></div>
<!-- История -->
<div id="history" class="history-list hidden"></div>

<!-- Модалка покупки -->
<div class="modal-overlay" id="buy-modal">
<div class="modal">
<h3 id="buy-modal-title">Покупка</h3>
<button class="modal-btn self" onclick="buyForSelf()">Купить себе</button>
<button class="modal-btn other" onclick="showPlayerSearch()">Купить кому-то</button>
<div class="modal-error" id="buy-error">Аккаунт не привязан! Нажмите «Привязать аккаунт».</div>
<button class="modal-btn close" onclick="closeModal()">Закрыть</button>
</div>
</div>

<!-- Модалка привязки -->
<div class="modal-overlay" id="link-modal">
<div class="modal">
<h3>Привязка аккаунта</h3>
<p style="color:var(--sec);font-size:0.85em;margin-bottom:16px;">Введите ник и пароль от сервера</p>
<input class="search-input" id="link-nick" placeholder="Ник (3-16 символов)" maxlength="16"><br>
<input class="search-input" id="link-pass" type="password" placeholder="Пароль" maxlength="32"><br>
<button class="modal-btn self" onclick="linkAccount()" style="background:var(--green);color:#000;">Привязать</button>
<button class="modal-btn close" onclick="closeModal()">Отмена</button>
</div>
</div>

<!-- Модалка поиска -->
<div class="modal-overlay" id="search-modal">
<div class="modal" style="max-width:480px;">
<h3>Кому купить?</h3>
<input class="search-input" id="search-input" placeholder="Введите ник игрока..." oninput="renderPlayerList()">
<div class="player-list" id="player-list"></div>
<button class="modal-btn close" onclick="closeModal()">Закрыть</button>
</div>
</div>

<!-- Модалка подтверждения -->
<div class="modal-overlay" id="confirm-modal">
<div class="modal">
<h3 id="confirm-title">Подтверждение</h3>
<p id="confirm-text" style="margin-bottom:20px;color:var(--sec);"></p>
<button class="modal-btn self" onclick="confirmPurchase()" style="background:var(--green);color:#000;">Подтвердить</button>
<button class="modal-btn close" onclick="closeModal()">Отмена</button>
</div>
</div>

<script>
// ====== ДАННЫЕ ======
const RANKS = [
  { id: 'HERO', name: 'HERO', icon: '⚔️', color: '#888', price: 0, desc: '/kit hero, /craft, 5 слотов аукциона, 2 привата' },
  { id: 'TITAN', name: 'TITAN', icon: '🔼', color: '#3498db', price: 0, desc: '+ /hat, /feed, /rtpfar, 7 слотов, 4 привата' },
  { id: 'AVENGER', name: 'AVENGER', icon: '⚓', color: '#9b59b6', price: 0, desc: '+ /enderchest, /ext, /ignore, 8 приватов' },
  { id: 'OVERLORD', name: 'OVERLORD', icon: '👑', color: '#e67e22', price: 0, desc: '+ /prefix, /repair, /near, x2 валюты, 16 приватов' },
  { id: 'MAGISTER', name: 'MAGISTER', icon: '🧙', color: '#1abc9c', price: 0, desc: '+ /nick, /invsee, /heal, /tptoggle, 48 приватов' },
  { id: 'IMPERATOR', name: 'IMPERATOR', icon: '💼', color: '#e74c3c', price: 0, desc: '+ /broadcast, /lightning, /rtp, x4 валюты, 96 приватов' },
  { id: 'DRAGON', name: 'DRAGON', icon: '🐲', color: '#8b0000', price: 0, desc: '+ /fly, /grant, погода, x6 валюты, 999+ приватов' }
];

const CASES = [
  { id: 'case_chrons', name: 'Сундук с хронами', icon: '⏱️', price: 50, desc: '100-500 (50%), 1000-2000 (30%), 2000-5000 (20%)', type: 'case' },
  { id: 'case_diliks', name: 'Сундук с диликами', icon: '💎', price: 100, desc: '10-100 (50%), 100-300 (30%), 300-500 (20%)', type: 'case' }
];

const SERVICES = [
  { id: 'unban', name: 'Разбан', icon: '🔓', price: 0, desc: 'Снятие бана. Нужен привязанный аккаунт.', type: 'service', needsAccount: true },
  { id: 'unmute', name: 'Размут', icon: '💬', price: 0, desc: 'Снятие мута. Нужен привязанный аккаунт.', type: 'service', needsAccount: true },
  { id: 'leather_set', name: 'Кожаный сет', icon: '🛡️', price: 0, desc: 'Кожаная броня + деревянные инструменты + баранина. Одноразово, можно забирать каждые 30 мин.', type: 'service', oneTime: true }
];

// Тестовые игроки
const TEST_PLAYERS = [
  { nick: 'Nokia', avatar: '🧑', rank: null, chrons: 10, diliks: 11, playtime: '3 часа', hasSet: false }
];

// ====== СОСТОЯНИЕ ======
let state = {
  account: null, // { nick, pass }
  currentRank: null, // индекс в RANKS
  hasLeatherSet: false,
  history: [],
  playerData: {} // ник -> { rank, hasSet, chrons, diliks }
};

let pendingPurchase = null; // { type, item, recipient }

// ====== ИНИЦИАЛИЗАЦИЯ ======
function initState() {
  const saved = localStorage.getItem('delayed_state_v3');
  if (saved) {
    state = JSON.parse(saved);
  }
  // Загружаем тестовых игроков в playerData
  TEST_PLAYERS.forEach(p => {
    if (!state.playerData[p.nick]) {
      state.playerData[p.nick] = {
        rank: p.rank,
        hasSet: p.hasSet,
        chrons: p.chrons,
        diliks: p.diliks,
        playtime: p.playtime
      };
    }
  });
}

function saveState() {
  localStorage.setItem('delayed_state_v3', JSON.stringify(state));
}

// ====== РЕНДЕР ======
function renderAll() {
  renderHeader();
  renderBought();
  renderPrivileges();
  renderCases();
  renderServices();
  renderHistory();
}

function renderHeader() {
  const hr = document.getElementById('header-right');
  let html = '';
  if (state.account) {
    html += `<span class="account-badge">Аккаунт: ${state.account.nick}</span>`;
  } else {
    html += `<button class="link-btn" onclick="openLinkModal()">Привязать аккаунт</button>`;
  }
  html += `<button class="link-btn reset" onclick="resetAll()">Сбросить всё</button>`;
  hr.innerHTML = html;
}

function renderBought() {
  const bar = document.getElementById('bought-bar');
  let html = '<strong>Куплено:</strong>';
  if (state.currentRank !== null) {
    const r = RANKS[state.currentRank];
    html += ` <span class="bought-item rank" style="background:${r.color};color:#000;">${r.icon} ${r.name}</span>`;
  }
  if (state.hasLeatherSet) {
    html += ` <span class="bought-item set">🛡️ Кожаный сет</span>`;
  }
  bar.innerHTML = html;
}

function renderPrivileges() {
  const grid = document.getElementById('privileges');
  let html = '';
  RANKS.forEach((rank, idx) => {
    const isCurrent = state.currentRank === idx;
    const isLower = state.currentRank !== null && idx < state.currentRank;
    
    let btnClass = 'card-btn free';
    let btnText = 'Бесплатно';
    let btnDisabled = false;
    
    if (isCurrent) {
      btnClass = 'card-btn current';
      btnText = 'Текущий ранг ✓';
      btnDisabled = true;
    } else if (isLower) {
      btnClass = 'card-btn locked';
      btnText = 'Недоступен';
      btnDisabled = true;
    }
    
    html += `
    <div class="card" style="border-color:${isCurrent ? rank.color : '#2a2a4e'};">
      ${isLower ? '<span class="badge locked-badge">НИЖЕ ТЕКУЩЕГО</span>' : ''}
      <span class="card-icon">${rank.icon}</span>
      <div class="card-name" style="color:${rank.color};">${rank.name}</div>
      <div class="card-price free">Бесплатно</div>
      <div class="card-desc">${rank.desc}</div>
      <button class="${btnClass}" ${btnDisabled ? 'disabled' : ''} onclick="${btnDisabled ? '' : `openBuyModal('rank', ${idx})`}">${btnText}</button>
    </div>`;
  });
  grid.innerHTML = html;
}

function renderCases() {
  const grid = document.getElementById('cases');
  let html = '';
  CASES.forEach((c, idx) => {
    html += `
    <div class="card">
      <span class="card-icon">${c.icon}</span>
      <div class="card-name">${c.name}</div>
      <div class="card-price paid">${c.price} ₽</div>
      <div class="card-desc">${c.desc}</div>
      <button class="card-btn paid" onclick="openBuyModal('case', ${idx})">Купить</button>
    </div>`;
  });
  grid.innerHTML = html;
}

function renderServices() {
  const grid = document.getElementById('services');
  let html = '';
  SERVICES.forEach((s, idx) => {
    const isCurrentSet = s.id === 'leather_set' && state.hasLeatherSet;
    let btnClass = 'card-btn free';
    let btnText = 'Бесплатно';
    let btnDisabled = false;
    
    if (isCurrentSet) {
      btnClass = 'card-btn current';
      btnText = 'Куплено ✓';
      btnDisabled = true;
    }
    
    // Разбан/размут — заблокированы без аккаунта только для покупки себе
    // Но кнопка всё равно работает (открывает модалку, где "купить кому-то" доступно)
    
    html += `
    <div class="card">
      <span class="card-icon">${s.icon}</span>
      <div class="card-name">${s.name}</div>
      <div class="card-price free">Бесплатно</div>
      <div class="card-desc">${s.desc}</div>
      <button class="${btnClass}" ${btnDisabled ? 'disabled' : ''} onclick="${btnDisabled ? '' : `openBuyModal('service', ${idx})`}">${btnText}</button>
    </div>`;
  });
  grid.innerHTML = html;
}

function renderHistory() {
  const div = document.getElementById('history');
  if (state.history.length === 0) {
    div.innerHTML = '<p style="text-align:center;color:var(--sec);">История покупок пуста.</p>';
    return;
  }
  let html = '';
  state.history.forEach(h => {
    html += `
    <div class="history-item">
      <div class="history-text">
        <span class="item-name">${h.itemName}</span>
        <span class="item-recipient"> → ${h.recipient}</span>
      </div>
      <div class="history-date">${h.date}</div>
    </div>`;
  });
  div.innerHTML = html;
}

// ====== ВКЛАДКИ ======
function switchTab(tabId, btn) {
  document.querySelectorAll('.grid, .history-list').forEach(el => el.classList.add('hidden'));
  document.getElementById(tabId).classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ====== МОДАЛКИ ======
function openLinkModal() {
  document.getElementById('link-nick').value = '';
  document.getElementById('link-pass').value = '';
  document.getElementById('link-modal').classList.add('show');
}

function openBuyModal(type, idx) {
  let item;
  if (type === 'rank') item = RANKS[idx];
  else if (type === 'case') item = CASES[idx];
  else item = SERVICES[idx];
  
  pendingPurchase = { type, idx, item };
  document.getElementById('buy-modal-title').textContent = `Покупка: ${item.name}`;
  document.getElementById('buy-error').classList.remove('show');
  document.getElementById('buy-modal').classList.add('show');
}

function closeModal() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('show'));
  pendingPurchase = null;
}

// ====== ПОКУПКА ======
function buyForSelf() {
  if (!pendingPurchase) return;
  const { type, idx, item } = pendingPurchase;
  
  // Проверка аккаунта
  if (!state.account) {
    document.getElementById('buy-error').classList.add('show');
    return;
  }
  
  // Привилегии
  if (type === 'rank') {
    // Нельзя купить ранг ниже или равный текущему
    if (state.currentRank !== null && idx <= state.currentRank) {
      closeModal();
      return;
    }
    state.currentRank = idx;
    addHistory(item.name, state.account.nick);
    saveState();
    renderAll();
    closeModal();
    return;
  }
  
  // Кейсы
  if (type === 'case') {
    addHistory(item.name, state.account.nick);
    saveState();
    renderHistory();
    closeModal();
    return;
  }
  
  // Услуги
  if (type === 'service') {
    if (item.id === 'leather_set') {
      if (state.hasLeatherSet) { closeModal(); return; }
      state.hasLeatherSet = true;
      addHistory(item.name, state.account.nick);
      saveState();
      renderAll();
      closeModal();
      return;
    }
    // Разбан/размут — можно сколько угодно
    addHistory(item.name, state.account.nick);
    saveState();
    renderHistory();
    closeModal();
    return;
  }
}

function showPlayerSearch() {
  if (!pendingPurchase) return;
  document.getElementById('search-input').value = '';
  renderPlayerList();
  document.getElementById('buy-modal').classList.remove('show');
  document.getElementById('search-modal').classList.add('show');
}

function renderPlayerList() {
  const query = document.getElementById('search-input').value.toLowerCase();
  const list = document.getElementById('player-list');
  let html = '';
  
  Object.keys(state.playerData).forEach(nick => {
    if (query && !nick.toLowerCase().includes(query)) return;
    const p = state.playerData[nick];
    const rankName = p.rank !== null ? RANKS[p.rank].name : 'Игрок';
    const rankColor = p.rank !== null ? RANKS[p.rank].color : '#888';
    
    // Проверка: можно ли купить этому игроку
    let canBuy = true;
    let note = '';
    
    if (pendingPurchase.type === 'rank') {
      if (p.rank !== null && pendingPurchase.idx <= p.rank) {
        canBuy = false;
        note = 'У игрока уже есть ранг выше или равный';
      }
    }
    if (pendingPurchase.item.id === 'leather_set' && p.hasSet) {
      canBuy = false;
      note = 'У игрока уже есть кожаный сет';
    }
    
    html += `
    <div class="player-card${canBuy ? '' : ' disabled'}" onclick="${canBuy ? `selectPlayer('${nick}')` : ''}">
      <div class="player-avatar">🧑</div>
      <div class="player-info">
        <div class="player-nick">${nick}</div>
        <div class="player-rank" style="color:${rankColor};">${rankName}</div>
        <div class="player-stats">⏱️ ${p.chrons} хронов | 💎 ${p.diliks} диликов | 🎮 ${p.playtime}</div>
        ${note ? `<div class="player-note" style="color:#f44;">${note}</div>` : ''}
      </div>
    </div>`;
  });
  
  if (html === '') {
    html = '<p style="text-align:center;color:var(--sec);padding:20px;">Игроки не найдены.</p>';
  }
  list.innerHTML = html;
}

function selectPlayer(nick) {
  pendingPurchase.recipient = nick;
  const p = state.playerData[nick];
  const rankName = p.rank !== null ? RANKS[p.rank].name : 'Игрок';
  document.getElementById('confirm-title').textContent = 'Подтверждение';
  document.getElementById('confirm-text').innerHTML = 
    `Купить <b>${pendingPurchase.item.name}</b> для игрока <b>${nick}</b>?<br><br>` +
    `Текущий ранг: ${rankName}<br>⏱️ ${p.chrons} хронов | 💎 ${p.diliks} диликов`;
  document.getElementById('search-modal').classList.remove('show');
  document.getElementById('confirm-modal').classList.add('show');
}

function confirmPurchase() {
  if (!pendingPurchase || !pendingPurchase.recipient) { closeModal(); return; }
  const { type, idx, item, recipient } = pendingPurchase;
  const p = state.playerData[recipient];
  
  if (type === 'rank') {
    if (p.rank !== null && idx <= p.rank) { closeModal(); return; }
    p.rank = idx;
  }
  if (item.id === 'leather_set') {
    if (p.hasSet) { closeModal(); return; }
    p.hasSet = true;
  }
  
  addHistory(item.name, recipient);
  saveState();
  renderAll();
  closeModal();
}

// ====== ПРИВЯЗКА ======
function linkAccount() {
  const nick = document.getElementById('link-nick').value.trim();
  const pass = document.getElementById('link-pass').value.trim();
  if (nick.length < 3 || nick.length > 16) {
    alert('Ник должен быть от 3 до 16 символов!');
    return;
  }
  if (pass.length < 1) {
    alert('Введите пароль!');
    return;
  }
  state.account = { nick, pass };
  saveState();
  renderHeader();
  closeModal();
}

// ====== ИСТОРИЯ ======
function addHistory(itemName, recipient) {
  const now = new Date();
  const dateStr = now.toLocaleString('ru-RU');
  state.history.unshift({ itemName, recipient, date: dateStr });
}

// ====== СБРОС ======
function resetAll() {
  if (!confirm('Сбросить все данные?')) return;
  localStorage.removeItem('delayed_state_v3');
  state = {
    account: null,
    currentRank: null,
    hasLeatherSet: false,
    history: [],
    playerData: {}
  };
  initState();
  renderAll();
}

// ====== СТАРТ ======
initState();
renderAll();
</script>
</body>
</html>
